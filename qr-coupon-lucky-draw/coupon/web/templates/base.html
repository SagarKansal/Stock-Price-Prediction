<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>{% block title %}{{ campaign_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<header class="masthead">
  <span class="masthead__mark" aria-hidden="true">★</span>
  <span class="masthead__name">{{ campaign_name }}</span>
</header>

<main class="shell">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  {% if support_phone %}
    <p>Need help? Call <a href="tel:{{ support_phone }}">{{ support_phone }}</a></p>
  {% endif %}
  <p class="footer__fine">One prize per coupon. Your details are used only to hand over your prize.</p>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
